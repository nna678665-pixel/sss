<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="main">
    <div class="sub-main">
      <div class="image-card">
        <div class="image-overlay-text">
          <div class="dots">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot active"></span>
          </div>
        </div>
      </div>
      <div class="form-container">
        <h1 class="form-title">Create an account</h1>

        <div class="sub-container">
          <input class="Username" type="text" placeholder="Enter Username">
          <input class="pw" type="password" placeholder="Enter PassWord">
          <!-- <label for="show-pw">
            <input type="checkbox" id="box">
            <span>Show password</span>
          </label> -->
        <div class="options-row">
          <label class="show-pw" for="togglePassword">
            <input type="checkbox" id="togglePassword">
            <span class="show-pw-text">Show password</span>
          </label>
          <a href="#" class="forgot-link">Forgot Password?</a>
        </div>
        <button type="submit" class="register-btn">Register</button>
        <button type="button" class="login-btn">Login</button>
        <!-- <p class="form-subtitle">
          Already have an account? <a href="#">Log in</a>
        </p> -->
      </div>
    </div> 

    <script>
        const pwInput = document.querySelector('.pw');
        const box = document.getElementById('togglePassword');

        box.addEventListener('change', () => {
          pwInput.type = box.checked ? 'text' : 'password';
        });
    </script>

  </div>   
</body>
</html>
